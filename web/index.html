<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MICROBOT is a modern robotics storefront for practical components and secure Shopee checkout.">
  <meta name="keywords" content="MICROBOT, robotics, Shopee, electronics, components, Arduino, ecommerce">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://horysheeet.github.io/FlutterProjectEcommerce/">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MICROBOT | Future Robotics Store">
  <meta property="og:description" content="Explore practical robotics components with a clean storefront and secure Shopee checkout.">
  <meta property="og:url" content="https://horysheeet.github.io/FlutterProjectEcommerce/">
  <meta property="og:image" content="https://horysheeet.github.io/FlutterProjectEcommerce/icons/Icon-512.png">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="MICROBOT | Future Robotics Store">
  <meta property="twitter:description" content="Explore practical robotics components with secure Shopee checkout.">
  <meta property="twitter:image" content="https://horysheeet.github.io/FlutterProjectEcommerce/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MICROBOT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MICROBOT | Future Robotics Store</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
